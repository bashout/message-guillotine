[package]
name = "guillotine"
# Version is cut from the git tag at release time (v2.x.y on merge to main);
# until then this is a development placeholder.
version = "0.1.0"
edition = "2021"
description = "Scheduled bulk delete and archive of your own chat messages (self-bot — violates the platform ToS, use at your own risk)"
license = "MIT"

[[bin]]
name = "guillotine"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:tray-icon", "dep:muda", "dep:iced", "dep:gtk", "dep:image"]

[dependencies]
tray-icon = { version = "0.19", optional = true }
muda = { version = "0.15", optional = true }
iced = { version = "0.14", features = ["tokio"], optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
getrandom = "0.3"
futures = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 2
