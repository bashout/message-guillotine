name: Rust CI

on:
  push:
    branches: [main, v2/rust-service]
  pull_request:
    branches: [main, v2/rust-service]

jobs:
  test:
    name: Test + clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (tray/GUI libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libayatana-appindicator3-dev pkg-config libgtk-3-dev

      - name: cargo test --release
        working-directory: rust
        run: cargo test --release

      - name: cargo clippy --all-targets -- -D warnings
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build --release --no-default-features (headless)
        working-directory: rust
        run: cargo build --release --no-default-features

  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: guillotine-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: guillotine-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: guillotine-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (tray/GUI libs, Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libayatana-appindicator3-dev pkg-config libgtk-3-dev

      - name: cargo build --release
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}
