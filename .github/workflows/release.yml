name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: setuptools-scm derives the version from tags

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked --python 3.14

      - name: Run tests
        run: uv run --no-sync pytest

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: message-guillotine-windows.exe
            rename_ext: .exe
          - os: macos-latest
            artifact: message-guillotine-macos-arm64
            rename_ext: ""
          - os: macos-15-intel
            artifact: message-guillotine-macos-x86_64
            rename_ext: ""
          - os: ubuntu-latest
            artifact: message-guillotine-linux
            rename_ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: setuptools-scm derives the version from tags

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra build --locked --python 3.14

      - name: Build executable
        run: uv run --no-sync python build_exe.py

      - name: Rename binary
        shell: bash
        run: |
          cd dist
          mv message-guillotine${{ matrix.rename_ext }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
