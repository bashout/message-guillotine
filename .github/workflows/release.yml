name: Release (Rust)

on:
  push:
    tags:
      - "v2.*"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: guillotine
            artifact: guillotine-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: guillotine
            artifact: guillotine-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: guillotine.exe
            artifact: guillotine-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (tray/GUI libs, Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libayatana-appindicator3-dev pkg-config libgtk-3-dev

      - name: cargo build --release
        working-directory: .
        run: cargo build --release --target ${{ matrix.target }}

      # cargo names the binary after [[bin]] ("guillotine"), not after the
      # published artifact name, so stage it under the release name first.
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
