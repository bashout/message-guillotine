[build-system]
requires = ["setuptools>=42", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "message-guillotine"
dynamic = ["version"]
description = "Bulk delete and archive your own chat messages"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
message-guillotine = "guillotine:main"
archive-viewer = "archive_viewer:main"

[tool.setuptools]
py-modules = ["guillotine", "archive_viewer"]
packages = ["message_guillotine", "message_guillotine.viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools_scm]
# The version comes from the latest vX.Y[.Z] git tag (setuptools-scm);
# commits past a tag build as X.Y.devN. Building without git metadata
# (e.g. from a zip download) falls back instead of failing;
# SETUPTOOLS_SCM_PRETEND_VERSION=... overrides in a pinch.
fallback_version = "0.0.0"
