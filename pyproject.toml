[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "message-guillotine"
version = "1.4.0"
description = "Bulk delete and archive your own chat messages"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
message-guillotine = "guillotine:main"
archive-viewer = "archive_viewer:main"

[tool.setuptools]
py-modules = ["guillotine", "archive_viewer"]
packages = ["message_guillotine", "message_guillotine.viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
